<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Silver retractable belt stanchion placeholder</title>
  <desc id="desc">Illustrated silver crowd-control post with a black retractable belt for the Events Rental Hub catalog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#e9edf1"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9ca3af"/><stop offset=".28" stop-color="#f8fafc"/><stop offset=".6" stop-color="#cbd5e1"/><stop offset="1" stop-color="#6b7280"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".18"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="450" cy="510" r="330" fill="#fff" opacity=".72"/>
  <g filter="url(#shadow)">
    <ellipse cx="450" cy="950" rx="210" ry="52" fill="#0f172a" opacity=".16"/>
    <ellipse cx="450" cy="900" rx="205" ry="70" fill="url(#metal)"/>
    <ellipse cx="450" cy="878" rx="144" ry="44" fill="#cbd5e1"/>
    <rect x="412" y="330" width="76" height="560" rx="34" fill="url(#metal)"/>
    <ellipse cx="450" cy="335" rx="94" ry="58" fill="url(#metal)"/>
    <rect x="430" y="292" width="405" height="42" rx="21" fill="#111827"/>
    <rect x="790" y="286" width="45" height="55" rx="12" fill="#4b5563"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="450" y="1060" fill="#111827" font-size="42" font-weight="700">SILVER BELT STANCHION</text>
    <text x="450" y="1112" fill="#7c5f35" font-size="25">Product photo coming soon</text>
  </g>
</svg>
